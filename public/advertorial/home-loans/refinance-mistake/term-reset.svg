<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="470" viewBox="0 0 1400 470" role="img" aria-labelledby="title desc">
<title id="title">Loan term reset timeline</title><desc id="desc">A thirty year mortgage is paid down for five years to twenty-five years remaining, then refinancing resets the term to thirty years.</desc>
<rect width="1400" height="470" rx="30" fill="#fff"/>
<line x1="180" y1="235" x2="1220" y2="235" stroke="#d9d5e7" stroke-width="12" stroke-linecap="round"/>
<circle cx="230" cy="235" r="48" fill="#12133f"/>
<circle cx="620" cy="235" r="48" fill="#85e8ff"/>
<circle cx="1005" cy="235" r="58" fill="#3f00de"/>
<text x="230" y="242" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" fill="#fff">30</text>
<text x="620" y="242" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" fill="#12133f">25</text>
<text x="1005" y="243" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="900" fill="#fff">30</text>
<text x="230" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" fill="#12133f">START</text>
<text x="230" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5e5c70">30-year loan</text>
<text x="620" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="900" fill="#12133f">5 YEARS LATER</text>
<text x="620" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5e5c70">25 years left</text>
<path d="M780 235 C830 145 900 145 950 215" fill="none" stroke="#3f00de" stroke-width="10" stroke-linecap="round"/>
<path d="M944 209 L951 166 L983 202 Z" fill="#3f00de"/>
<text x="865" y="105" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="900" fill="#3f00de">REFINANCE</text>
<text x="1005" y="315" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5e5c70">back to 30 years</text>
<rect x="1085" y="115" width="220" height="88" rx="18" fill="#f4f0ff"/>
<text x="1195" y="150" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#12133f">LOWER REQUIRED</text>
<text x="1195" y="180" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="900" fill="#3f00de">REPAYMENT</text>
</svg>